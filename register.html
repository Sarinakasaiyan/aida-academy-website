<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ورود و ثبت‌نام | آکادمی آیدا عبداللهی</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --jasmine-1: #f3eefb;
            --jasmine-2: #e7defa;
            --gold: #c9a86a;
            --gold-light: #e8d5a8;
            --purple-deep: #5a3f8c;
            --purple-mid: #7f5fc7;
            --purple-light: #b39de0;
            --navy-1: #0a1832;
            --navy-2: #0f2447;
            --azure: #1c4fa3;
            --azure-light: #3a7bd5;
            --azure-glow: #5e9bff;
            --ink: #1b1b1f;
            --ink-light: #4a4458;
            --white: #ffffff;
            --radius-lg: 32px;
            --radius-md: 20px;
            --shadow-soft: 0 20px 50px -15px rgba(20, 20, 40, 0.25);
            --shadow-card: 0 10px 30px -8px rgba(20, 20, 40, 0.12);
            --transition: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 10% 20%, rgba(201, 168, 106, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(127, 95, 199, 0.10) 0%, transparent 50%),
                linear-gradient(145deg, #fbfaf8 0%, #f1eef9 100%);
            padding: 20px;
            direction: rtl;
        }

        /* ===== بازگشت به صفحه اصلی ===== */
        .back-link {
            position: fixed;
            top: 24px;
            right: 28px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--purple-deep);
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            padding: 10px 20px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 6px 20px -10px rgba(0, 0, 0, 0.10);
            transition: var(--transition);
            text-decoration: none;
            z-index: 100;
        }
        .back-link:hover {
            background: #fff;
            box-shadow: 0 12px 30px -12px rgba(90, 63, 140, 0.25);
            transform: translateY(-2px);
        }
        .back-link svg {
            width: 18px;
            height: 18px;
        }

        /* ===== کارت اصلی ===== */
        .auth-card {
            background: rgba(255, 255, 255, 0.70);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-radius: var(--radius-lg);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: var(--shadow-soft), inset 0 0 0 1px rgba(255, 255, 255, 0.8);
            padding: 48px 40px 42px 40px;
            max-width: 480px;
            width: 100%;
            position: relative;
            overflow: hidden;
            transition: var(--transition);
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: -120px;
            right: -120px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(201, 168, 106, 0.10), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        .auth-card::after {
            content: '';
            position: absolute;
            bottom: -100px;
            left: -100px;
            width: 260px;
            height: 260px;
            background: radial-gradient(circle, rgba(127, 95, 199, 0.08), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        /* ===== لوگو + عنوان ===== */
        .auth-header {
            text-align: center;
            margin-bottom: 32px;
            position: relative;
            z-index: 2;
        }
        .auth-header .logo-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 10px;
        }
        .auth-header .logo-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(145deg, #ffffff, #f1eef9);
            box-shadow: 0 8px 24px -8px rgba(90, 63, 140, 0.18);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px solid #fff;
        }
        .auth-header .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .auth-header h1 {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--purple-deep), var(--azure-light));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }
        .auth-header p {
            font-size: 15px;
            color: var(--ink-light);
            margin-top: 4px;
            font-weight: 500;
        }

        /* ===== تب‌ها ===== */
        .tabs {
            display: flex;
            border-radius: 60px;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.7);
            padding: 4px;
            margin-bottom: 32px;
            position: relative;
            z-index: 2;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.02);
        }
        .tab-btn {
            flex: 1;
            padding: 12px 10px;
            border: none;
            background: transparent;
            border-radius: 40px;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 15px;
            font-weight: 700;
            color: var(--ink-light);
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            text-align: center;
        }
        .tab-btn.active {
            background: #fff;
            color: var(--purple-deep);
            box-shadow: 0 6px 20px -10px rgba(90, 63, 140, 0.20);
        }
        .tab-btn:hover:not(.active) {
            color: var(--purple-deep);
        }

        /* ===== فرم‌ها ===== */
        .form-container {
            position: relative;
            z-index: 2;
        }
        .auth-form {
            display: none;
            flex-direction: column;
            gap: 20px;
            animation: fadeSlide 0.35s ease;
        }
        .auth-form.active {
            display: flex;
        }

        @keyframes fadeSlide {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .field-group label {
            font-size: 13px;
            font-weight: 600;
            color: var(--ink-light);
            padding-right: 4px;
        }
        .field-group .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 16px;
            border: 1.5px solid rgba(0, 0, 0, 0.06);
            transition: var(--transition);
            padding: 0 16px;
        }
        .field-group .input-wrap:focus-within {
            border-color: var(--purple-mid);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(127, 95, 199, 0.08);
        }
        .field-group .input-wrap .icon {
            color: var(--ink-light);
            opacity: 0.5;
            flex-shrink: 0;
            margin-left: 10px;
            display: flex;
            align-items: center;
        }
        .field-group .input-wrap .icon svg {
            width: 20px;
            height: 20px;
        }
        .field-group .input-wrap input {
            width: 100%;
            padding: 14px 0;
            border: none;
            background: transparent;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 15px;
            color: var(--ink);
            outline: none;
        }
        .field-group .input-wrap input::placeholder {
            color: #b5b0c4;
            font-weight: 400;
        }

        /* ===== گزینه‌های فرعی ===== */
        .form-extras {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13.5px;
            margin-top: -4px;
        }
        .form-extras label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--ink-light);
            font-weight: 500;
            cursor: pointer;
        }
        .form-extras label input[type="checkbox"] {
            accent-color: var(--purple-mid);
            width: 17px;
            height: 17px;
            cursor: pointer;
        }
        .form-extras a {
            color: var(--purple-mid);
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition);
        }
        .form-extras a:hover {
            color: var(--azure-light);
        }

        /* ===== دکمه اصلی ===== */
        .submit-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 60px;
            background: linear-gradient(135deg, var(--purple-mid), #9c7fd6);
            color: #fff;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 12px 30px -10px rgba(90, 63, 140, 0.30);
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 40px -12px rgba(90, 63, 140, 0.40);
        }
        .submit-btn:active {
            transform: scale(0.98);
        }

        /* ===== جداکننده ===== */
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 10px 0 6px 0;
            color: #b5b0c4;
            font-size: 13px;
            font-weight: 500;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(0, 0, 0, 0.06);
        }

        /* ===== دکمه‌های اجتماعی ===== */
        .social-row {
            display: flex;
            gap: 12px;
        }
        .social-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 13px;
            border-radius: 60px;
            border: 1.5px solid rgba(0, 0, 0, 0.06);
            background: rgba(255, 255, 255, 0.4);
            font-family: 'Vazirmatn', sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: var(--ink-light);
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }
        .social-btn:hover {
            background: #fff;
            border-color: rgba(127, 95, 199, 0.20);
            box-shadow: 0 6px 20px -10px rgba(0, 0, 0, 0.08);
        }
        .social-btn svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }
        .social-btn.google svg {
            color: #ea4335;
        }
        .social-btn.instagram svg {
            color: #c13584;
        }

        /* ===== پیام خطا / موفقیت ===== */
        .form-message {
            font-size: 13px;
            font-weight: 600;
            padding: 10px 16px;
            border-radius: 14px;
            display: none;
            align-items: center;
            gap: 8px;
        }
        .form-message.error {
            display: flex;
            background: #fee9e7;
            color: #b34033;
            border: 1px solid #fcd4cf;
        }
        .form-message.success {
            display: flex;
            background: #e6f5ed;
            color: #1e7b4a;
            border: 1px solid #c8f0dc;
        }

        /* ===== ریسپانسیو ===== */
        @media (max-width: 520px) {
            .auth-card {
                padding: 30px 20px 28px 20px;
            }
            .auth-header h1 {
                font-size: 22px;
            }
            .tab-btn {
                font-size: 13px;
                padding: 10px 6px;
            }
            .social-btn {
                font-size: 12px;
                padding: 11px 8px;
            }
            .back-link {
                top: 16px;
                right: 16px;
                padding: 8px 16px;
                font-size: 12px;
            }
            .back-link span {
                display: none;
            }
        }
        @media (max-width: 400px) {
            .form-extras {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            .social-row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <!-- ===== لینک بازگشت ===== -->
    <a href="index.html" class="back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>بازگشت به صفحه اصلی</span>
    </a>

    <!-- ===== کارت اصلی ===== -->
    <div class="auth-card">

        <!-- هدر -->
        <div class="auth-header">
            <div class="logo-wrap">
                <div class="logo-icon">
                    <img src="logo.png" height="200" width="200" alt="آیدا عبداللهی" />
                </div>
            </div>
            <h1>آکادمی آیدا</h1>
            <p>ورود و ثبت‌نام در دوره‌های آموزشی</p>
        </div>

        <!-- تب‌ها -->
        <div class="tabs" role="tablist">
            <button class="tab-btn active" data-tab="login" role="tab" aria-selected="true">ورود</button>
            <button class="tab-btn" data-tab="register" role="tab" aria-selected="false">ثبت‌نام</button>
        </div>

        <!-- فرم‌ها -->
        <div class="form-container">

            <!-- ===== فرم ورود ===== -->
            <form class="auth-form active" id="login-form" novalidate>
                <div class="field-group">
                    <label for="login-email">ایمیل یا شماره تماس</label>
                    <div class="input-wrap">
                        <span class="icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                                <polyline points="22,6 12,13 2,6"/>
                            </svg>
                        </span>
                        <input type="text" id="login-email" placeholder="example@email.com یا ۰۹۱۲..." required />
                    </div>
                </div>

                <div class="field-group">
                    <label for="login-password">رمز عبور</label>
                    <div class="input-wrap">
                        <span class="icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0110 0v4"/>
                            </svg>
                        </span>
                        <input type="password" id="login-password" placeholder="••••••••" required />
                    </div>
                </div>

                <div class="form-extras">
                    <label>
                        <input type="checkbox" checked /> مرا به خاطر بسپار
                    </label>
                    <a href="#">فراموشی رمز عبور؟</a>
                </div>

                <div class="form-message" id="login-message"></div>

                <button type="submit" class="submit-btn">
                    ورود
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 6l-6 6 6 6"/>
                    </svg>
                </button>

                <div class="divider">یا</div>

                <div class="social-row">
                    <button type="button" class="social-btn google">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                        گوگل
                    </button>
                    <button type="button" class="social-btn instagram">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="5" ry="5"/>
                            <circle cx="12" cy="12" r="4"/>
                            <circle cx="17.2" cy="6.8" r="1"/>
                        </svg>
                        اینستاگرام
                    </button>
                </div>
            </form>

            <!-- ===== فرم ثبت‌نام ===== -->
            <form class="auth-form" id="register-form" novalidate>
                <div class="field-group">
                    <label for="register-name">نام و نام خانوادگی</label>
                    <div class="input-wrap">
                        <span class="icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                        </span>
                        <input type="text" id="register-name" placeholder="آیدا عبداللهی" required />
                    </div>
                </div>

                <div class="field-group">
                    <label for="register-email">ایمیل</label>
                    <div class="input-wrap">
                        <span class="icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                                <polyline points="22,6 12,13 2,6"/>
                            </svg>
                        </span>
                        <input type="email" id="register-email" placeholder="example@email.com" required />
                    </div>
                </div>

                <div class="field-group">
                    <label for="register-phone">شماره تماس</label>
                    <div class="input-wrap">
                        <span class="icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.362 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.574 2.81.7A2 2 0 0122 16.92z"/>
                            </svg>
                        </span>
                        <input type="tel" id="register-phone" placeholder="۰۹۱۲۳۴۵۶۷۸۹" required />
                    </div>
                </div>

                <div class="field-group">
                    <label for="register-password">رمز عبور</label>
                    <div class="input-wrap">
                        <span class="icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0110 0v4"/>
                            </svg>
                        </span>
                        <input type="password" id="register-password" placeholder="حداقل ۶ کاراکتر" required minlength="6" />
                    </div>
                </div>

                <div class="field-group">
                    <label for="register-confirm">تکرار رمز عبور</label>
                    <div class="input-wrap">
                        <span class="icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0110 0v4"/>
                            </svg>
                        </span>
                        <input type="password" id="register-confirm" placeholder="تکرار رمز عبور" required />
                    </div>
                </div>

                <div class="form-extras">
                    <label>
                        <input type="checkbox" required /> <span>با <a href="#" style="color:var(--purple-mid);">قوانین و شرایط</a> موافقم</span>
                    </label>
                </div>

                <div class="form-message" id="register-message"></div>

                <button type="submit" class="submit-btn">
                    ثبت‌نام
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 6l-6 6 6 6"/>
                    </svg>
                </button>

                <div class="divider">یا</div>

                <div class="social-row">
                    <button type="button" class="social-btn google">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                        گوگل
                    </button>
                    <button type="button" class="social-btn instagram">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="5" ry="5"/>
                            <circle cx="12" cy="12" r="4"/>

                        اینستاگرام

        </div><!-- /form-container -->
    </div><!-- /auth-card -->

    <!-- ===== اسکریپت ===== -->
    <script>
        (function() {
            // ---- تب‌ها ----
            const tabs = document.querySelectorAll('.tab-btn');
            const forms = {
                login: document.getElementById('login-form'),
                register: document.getElementById('register-form')
            };
            const messages = {
                login: document.getElementById('login-message'),
                register: document.getElementById('register-message')
            };

            function switchTab(tabId) {
                // active class on buttons
                tabs.forEach(btn => {
                    const isActive = btn.dataset.tab === tabId;
                    btn.classList.toggle('active', isActive);
                    btn.setAttribute('aria-selected', isActive);
                });
                // show/hide forms
                Object.keys(forms).forEach(key => {
                    forms[key].classList.toggle('active', key === tabId);
                });
                // clear messages
                Object.keys(messages).forEach(key => {
                    messages[key].className = 'form-message';
                    messages[key].style.display = 'none';
                });
            }

            tabs.forEach(btn => {
                btn.addEventListener('click', function() {
                    switchTab(this.dataset.tab);
                });
            });

            // ---- اعتبارسنجی ساده ----
            function showMessage(formId, type, text) {
                const msg = messages[formId];
                msg.className = 'form-message ' + type;
                msg.style.display = 'flex';
                msg.textContent = text;
            }

            function clearMessage(formId) {
                const msg = messages[formId];
                msg.className = 'form-message';
                msg.style.display = 'none';
            }

            // ---- ورود ----
            document.getElementById('login-form').addEventListener('submit', function(e) {
                e.preventDefault();
                const email = document.getElementById('login-email').value.trim();
                const pass = document.getElementById('login-password').value.trim();

                if (!email || !pass) {
                    showMessage('login', 'error', 'لطفاً تمام فیلدها را پر کنید.');
                    return;
                }
                if (pass.length < 6) {
                    showMessage('login', 'error', 'رمز عبور باید حداقل ۶ کاراکتر باشد.');
                    return;
                }
                // شبیه‌سازی موفقیت
                showMessage('login', 'success', '✅ ورود موفق! در حال انتقال به داشبورد...');
                // می‌توانید ریدایرکت کنید: window.location.href = 'dashboard.html';
            });

            // ---- ثبت‌نام ----
            document.getElementById('register-form').addEventListener('submit', function(e) {
                e.preventDefault();
                const name = document.getElementById('register-name').value.trim();
                const email = document.getElementById('register-email').value.trim();
                const phone = document.getElementById('register-phone').value.trim();
                const pass = document.getElementById('register-password').value;
                const confirm = document.getElementById('register-confirm').value;
                const agree = document.querySelector('#register-form input[type="checkbox"]');

                if (!name || !email || !phone || !pass || !confirm) {
                    showMessage('register', 'error', 'لطفاً تمام فیلدها را پر کنید.');
                    return;
                }
                if (pass.length < 6) {
                    showMessage('register', 'error', 'رمز عبور باید حداقل ۶ کاراکتر باشد.');
                    return;
                }
                if (pass !== confirm) {
                    showMessage('register', 'error', 'رمز عبور و تکرار آن مطابقت ندارند.');
                    return;
                }
                if (!agree.checked) {
                    showMessage('register', 'error', 'برای ثبت‌نام باید با قوانین موافقت کنید.');
                    return;
                }
                // موفقیت
                showMessage('register', 'success', '✅ ثبت‌نام با موفقیت انجام شد!');
                // می‌توانید ریدایرکت کنید
            });

            // ---- پاک کردن پیام‌ها هنگام تایپ ----
            document.querySelectorAll('.input-wrap input').forEach(input => {
                input.addEventListener('input', function() {
                    const form = this.closest('.auth-form');
                    if (!form) return;
                    const id = form.id.replace('-form', '');
                    clearMessage(id);
                });
            });

            // ---- دکمه‌های اجتماعی (نمایش پیام) ----
            document.querySelectorAll('.social-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const form = this.closest('.auth-form');
                    const id = form.id.replace('-form', '');
                    showMessage(id, 'info', '🔗 در حال اتصال به ' + this.textContent.trim() + ' ...');
                    setTimeout(() => {
                        clearMessage(id);
                    }, 2500);
                });
            });

        })();
    </script>

</body>
</html>
