<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>آزمون هوش و استعدادیابی | آکادمی آیدا</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        /* ===== RESET & VARIABLES ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --jasmine-1: #f3eefb;
            --jasmine-2: #e7defa;
            --gold: #c9a86a;
            --gold-light: #e8d5a8;
            --gold-dark: #b8924a;
            --purple-deep: #5a3f8c;
            --purple-mid: #7f5fc7;
            --purple-light: #b39de0;
            --navy-1: #0a1832;
            --azure: #1c4fa3;
            --azure-light: #3a7bd5;
            --azure-glow: #5e9bff;
            --ink: #1b1b1f;
            --ink-light: #4a4458;
            --white: #ffffff;
            --radius-lg: 32px;
            --radius-md: 20px;
            --radius-sm: 14px;
            --shadow-soft: 0 20px 50px -15px rgba(20, 20, 40, 0.25);
            --shadow-card: 0 10px 30px -8px rgba(20, 20, 40, 0.12);
            --shadow-hover: 0 25px 55px -15px rgba(90, 63, 140, 0.30);
            --transition: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #fbfaf8;
            color: var(--ink);
            overflow-x: hidden;
            direction: rtl;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            position: relative;
        }

        /* ===== پس‌زمینه با بادکنک‌ها و ابرهای شناور ===== */
        .bg-fun {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .balloon {
            position: absolute;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            animation: floatBalloon 20s infinite alternate ease-in-out;
            opacity: 0.15;
        }
        .balloon:nth-child(1) {
            width: 100px;
            height: 130px;
            top: 5%;
            left: 5%;
            background: radial-gradient(circle at 30% 30%, #ff9a9e, #fad0c4);
            animation-duration: 22s;
        }
        .balloon:nth-child(2) {
            width: 80px;
            height: 100px;
            bottom: 15%;
            right: 8%;
            background: radial-gradient(circle at 30% 30%, #a18cd1, #fbc2eb);
            animation-duration: 26s;
            animation-delay: 2s;
        }
        .balloon:nth-child(3) {
            width: 120px;
            height: 150px;
            top: 40%;
            right: 25%;
            background: radial-gradient(circle at 30% 30%, #fbc2eb, #a6c1ee);
            animation-duration: 24s;
            animation-delay: 4s;
        }
        .balloon:nth-child(4) {
            width: 70px;
            height: 90px;
            bottom: 30%;
            left: 15%;
            background: radial-gradient(circle at 30% 30%, #fddb92, #d1fdff);
            animation-duration: 28s;
            animation-delay: 1s;
        }
        .balloon::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 20px;
            background: rgba(0, 0, 0, 0.1);
        }
        @keyframes floatBalloon {
            0% {
                transform: translate(0, 0) rotate(-5deg) scale(1);
            }
            33% {
                transform: translate(30px, -30px) rotate(5deg) scale(1.05);
            }
            66% {
                transform: translate(-20px, 20px) rotate(-3deg) scale(0.95);
            }
            100% {
                transform: translate(15px, -15px) rotate(4deg) scale(1.02);
            }
        }
        /* ابرهای کوچک */
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 100px;
            animation: cloudMove 30s linear infinite;
        }
        .cloud::before,
        .cloud::after {
            content: '';
            position: absolute;
            background: inherit;
            border-radius: 50%;
        }
        .cloud::before {
            width: 60%;
            height: 60%;
            top: -40%;
            left: 10%;
        }
        .cloud::after {
            width: 40%;
            height: 40%;
            top: -20%;
            right: 10%;
        }
        .cloud:nth-child(5) {
            width: 120px;
            height: 40px;
            top: 12%;
            left: -10%;
            animation-duration: 35s;
            opacity: 0.3;
        }
        .cloud:nth-child(6) {
            width: 160px;
            height: 50px;
            bottom: 20%;
            right: -15%;
            animation-duration: 40s;
            animation-delay: 5s;
            opacity: 0.2;
        }
        @keyframes cloudMove {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(120vw);
            }
        }

        /* ===== کارت اصلی ===== */
        .quiz-card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.80);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: var(--radius-lg);
            border: 2px solid rgba(255, 255, 255, 0.7);
            box-shadow: var(--shadow-soft), inset 0 0 0 1px rgba(255, 255, 255, 0.9);
            padding: 40px 38px 38px 38px;
            max-width: 820px;
            width: 100%;
            transition: var(--transition);
            animation: fadeInUp 0.8s ease;
        }
        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(50px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ===== هدر با کاراکتر ===== */
        .quiz-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 16px;
        }
        .quiz-header .title-group {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .mascot {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            box-shadow: 0 8px 24px -8px rgba(127, 95, 199, 0.25);
            animation: bounceMascot 3s infinite ease-in-out;
            border: 3px solid #fff;
            flex-shrink: 0;
        }
        @keyframes bounceMascot {
            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-8px) rotate(6deg);
            }
        }
        .quiz-header h1 {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--purple-deep), var(--azure-light));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }
        .quiz-header h1 small {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--ink-light);
            background: none;
            -webkit-background-clip: unset;
            background-clip: unset;
            color: var(--ink-light);
        }
        .score-box {
            background: linear-gradient(135deg, var(--gold-light), var(--gold));
            padding: 10px 22px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 18px;
            color: var(--navy-1);
            box-shadow: 0 6px 20px -8px rgba(201, 168, 106, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }
        .score-box span {
            font-size: 24px;
        }

        /* ===== نوار پیشرفت ===== */
        .progress-wrap {
            background: rgba(0, 0, 0, 0.06);
            border-radius: 60px;
            height: 12px;
            margin-bottom: 30px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.3);
            position: relative;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--purple-mid), var(--azure-light), var(--gold));
            border-radius: 60px;
            transition: width 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
        }
        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(100%);
            }
        }
        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
            color: var(--ink-light);
            margin-top: 6px;
        }

        /* ===== سوال ===== */
        .question-area {
            margin-bottom: 28px;
        }
        .question-number {
            font-size: 14px;
            font-weight: 700;
            color: var(--purple-mid);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .question-number .q-badge {
            background: var(--jasmine-2);
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 12px;
        }
        .question-text {
            font-size: 22px;
            font-weight: 700;
            line-height: 1.7;
            padding: 6px 0;
            color: var(--ink);
        }
        .question-text .emoji {
            font-size: 28px;
            margin-left: 8px;
        }

        /* ===== گزینه‌ها ===== */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 8px;
        }
        .option-btn {
            padding: 16px 20px;
            border-radius: var(--radius-sm);
            border: 2.5px solid rgba(0, 0, 0, 0.06);
            background: rgba(255, 255, 255, 0.6);
            font-family: 'Vazirmatn', sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: var(--ink);
            cursor: pointer;
            transition: var(--transition);
            text-align: right;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }
        .option-btn:hover:not(.disabled) {
            transform: translateY(-3px);
            border-color: var(--purple-mid);
            background: #fff;
            box-shadow: 0 8px 24px -10px rgba(90, 63, 140, 0.15);
        }
        .option-btn .letter {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--jasmine-2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 800;
            color: var(--purple-deep);
            flex-shrink: 0;
            transition: var(--transition);
        }
        .option-btn:hover:not(.disabled) .letter {
            background: var(--purple-mid);
            color: #fff;
        }
        .option-btn.correct {
            border-color: #2e9b5e;
            background: #e6f5ed;
        }
        .option-btn.correct .letter {
            background: #2e9b5e;
            color: #fff;
        }
        .option-btn.wrong {
            border-color: #d34a4a;
            background: #fee9e7;
        }
        .option-btn.wrong .letter {
            background: #d34a4a;
            color: #fff;
        }
        .option-btn.disabled {
            cursor: default;
            opacity: 0.7;
        }
        .option-btn.disabled:hover {
            transform: none;
            border-color: rgba(0, 0, 0, 0.06);
        }
        .option-btn.show-correct {
            border-color: #2e9b5e;
            background: #e6f5ed;
        }
        .option-btn.show-correct .letter {
            background: #2e9b5e;
            color: #fff;
        }

        /* ===== دکمه‌های پایین ===== */
        .quiz-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            gap: 14px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 14px 30px;
            border: none;
            border-radius: 60px;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #fff;
            color: var(--ink);
            box-shadow: 0 4px 16px -8px rgba(0, 0, 0, 0.06);
            border: 1.5px solid rgba(0, 0, 0, 0.06);
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px -12px rgba(0, 0, 0, 0.12);
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--purple-mid), #9c7fd6);
            color: #fff;
            border: none;
            box-shadow: 0 12px 30px -10px rgba(90, 63, 140, 0.30);
        }
        .btn-primary:hover {
            box-shadow: 0 20px 40px -12px rgba(90, 63, 140, 0.40);
        }
        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        .btn-gold {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: #fff;
            border: none;
            box-shadow: 0 12px 30px -10px rgba(201, 168, 106, 0.30);
        }
        .btn-gold:hover {
            box-shadow: 0 20px 40px -12px rgba(201, 168, 106, 0.40);
        }
        .btn-outline {
            background: transparent;
            border: 2px solid rgba(0, 0, 0, 0.08);
        }
        .btn-outline:hover {
            border-color: var(--purple-mid);
            background: rgba(127, 95, 199, 0.04);
        }

        /* ===== صفحه نتایج ===== */
        .result-screen {
            display: none;
            text-align: center;
            padding: 20px 0 10px 0;
            animation: fadeInUp 0.6s ease;
        }
        .result-screen.active {
            display: block;
        }
        .result-screen .big-emoji {
            font-size: 72px;
            margin-bottom: 12px;
            animation: bounceMascot 2s infinite ease-in-out;
        }
        .result-screen h2 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .result-screen .score-final {
            font-size: 52px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--gold), var(--purple-deep));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-block;
        }
        .result-screen .msg {
            font-size: 18px;
            color: var(--ink-light);
            margin-top: 12px;
            line-height: 1.8;
        }
        .result-stars {
            font-size: 40px;
            letter-spacing: 8px;
            margin: 12px 0 20px 0;
        }
        .result-actions {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        /* ===== بازگشت ===== */
        .back-link {
            position: fixed;
            top: 24px;
            right: 28px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--purple-deep);
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            padding: 10px 20px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 6px 20px -10px rgba(0, 0, 0, 0.10);
            transition: var(--transition);
            text-decoration: none;
        }
        .back-link:hover {
            background: #fff;
            box-shadow: 0 12px 30px -12px rgba(90, 63, 140, 0.25);
            transform: translateY(-2px);
        }
        .back-link svg {
            width: 18px;
            height: 18px;
        }

        /* ===== ریسپانسیو ===== */
        @media (max-width: 700px) {
            .quiz-card {
                padding: 28px 20px;
            }
            .options-grid {
                grid-template-columns: 1fr;
            }
            .quiz-header h1 {
                font-size: 22px;
            }
            .question-text {
                font-size: 19px;
            }
            .score-box {
                font-size: 15px;
                padding: 8px 16px;
            }
            .mascot {
                width: 50px;
                height: 50px;
                font-size: 26px;
            }
        }
        @media (max-width: 450px) {
            .quiz-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .quiz-actions {
                flex-direction: column;
                align-items: stretch;
            }
            .btn {
                justify-content: center;
            }
            .back-link span {
                display: none;
            }
            .back-link {
                top: 16px;
                right: 16px;
                padding: 8px 14px;
            }
            .result-screen .score-final {
                font-size: 38px;
            }
        }

        /* حالت خاموشی برای سوالات (غیرفعال) */
        .quiz-content.hidden {
            display: none;
        }
    </style>
</head>
<body>

    <!-- ===== پس‌زمینه با بادکنک و ابر ===== -->
    <div class="bg-fun">
        <div class="balloon"></div>
        <div class="balloon"></div>
        <div class="balloon"></div>
        <div class="balloon"></div>
        <div class="cloud"></div>
        <div class="cloud"></div>
    </div>

    <!-- ===== لینک بازگشت ===== -->
    <a href="aidaacademy-landing.html" class="back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>بازگشت</span>
    </a>

    <!-- ===== کارت اصلی آزمون ===== -->
    <div class="quiz-card" id="quizApp">

        <!-- هدر -->
        <div class="quiz-header">
            <div class="title-group">
                <div class="mascot">🦉</div>
                <div>
                    <h1>
                        آزمون هوش و استعداد
                        <small>✨ مخصوص کودکان ۷ تا ۱۲ سال</small>
                    </h1>
                </div>
            </div>
            <div class="score-box">
                ⭐ <span id="scoreDisplay">۰</span>
            </div>
        </div>

        <!-- نوار پیشرفت -->
        <div class="progress-wrap">
            <div class="progress-bar" id="progressBar" style="width:0%;"></div>
        </div>
        <div class="progress-text">
            <span id="questionCounter">سوال ۱ از ۱۰</span>
            <span id="progressPercent">۰%</span>
        </div>

        <!-- ===== محتوای سوالات ===== -->
        <div class="quiz-content" id="quizContent">
            <div class="question-area">
                <div class="question-number">
                    <span class="q-badge" id="qBadge">سوال ۱</span>
                    <span>🌟</span>
                </div>
                <div class="question-text" id="questionText">
                    <span class="emoji">🧠</span>
                    بارگذاری سوال...
                </div>
            </div>

            <div class="options-grid" id="optionsContainer">
                <!-- گزینه‌ها توسط JS ساخته می‌شوند -->
            </div>

            <div class="quiz-actions">
                <button class="btn btn-outline" id="resetBtn" title="شروع مجدد">
                    🔄 شروع مجدد
                </button>
                <button class="btn btn-primary" id="nextBtn" disabled>
                    سوال بعدی
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 6l-6 6 6 6"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- ===== صفحه نتایج ===== -->
        <div class="result-screen" id="resultScreen">
            <div class="big-emoji">🏆</div>
            <h2>آفرین! آزمون تمام شد</h2>
            <div class="score-final" id="finalScore">۰</div>
            <div style="font-size:18px; font-weight:600; color:var(--ink-light);">از ۱۰۰ امتیاز</div>
            <div class="result-stars" id="resultStars">⭐⭐⭐</div>
            <div class="msg" id="resultMsg">تو خیلی باهوشی! به تلاشت ادامه بده.</div>
            <div class="result-actions">
                <button class="btn btn-gold" id="retryBtn">🔄 دوباره امتحان کن</button>
                <button class="btn btn-primary" id="homeBtn">🏠 صفحه اصلی</button>
            </div>
        </div>

    </div>

    <!-- ===== اسکریپت کامل آزمون ===== -->
    <script>
        (function() {
            // ----- داده‌های سوالات (کودکانه و جذاب) -----
            const questions = [{
                question: 'کدام یک از این حیوانات پرواز می‌کند؟',
                options: ['فیل', 'پرنده 🐦', 'ماهی', 'گربه'],
                correct: 1
            }, {
                question: 'رنگ آسمان در یک روز آفتابی چه رنگی است؟',
                options: ['قرمز', 'آبی ☀️', 'سبز', 'زرد'],
                correct: 1
            }, {
                question: 'کدام عدد از همه بزرگ‌تر است؟',
                options: ['۷', '۱۲', '۲۵', '۹'],
                correct: 2
            }, {
                question: 'چه چیزی در شب می‌درخشد؟',
                options: ['خورشید', 'ماه 🌙', 'ابر', 'باران'],
                correct: 1
            }, {
                question: 'کدام میوه زرد رنگ است؟',
                options: ['سیب', 'موز 🍌', 'انگور', 'هندوانه'],
                correct: 1
            }, {
                question: 'چند تا پا دارد یک گربه؟',
                options: ['۲', '۳', '۴', '۵'],
                correct: 2
            }, {
                question: 'کدام وسیله برای نوشتن استفاده می‌شود؟',
                options: ['چنگال', 'قاشق', 'مداد ✏️', 'چکش'],
                correct: 2
            }, {
                question: 'چه چیزی در آب زندگی می‌کند؟',
                options: ['شیر', 'خرس', 'دلفین 🐬', 'پلنگ'],
                correct: 2
            }, {
                question: 'کدام شکل سه گوش است؟',
                options: ['مربع', 'دایره', 'مثلث 🔺', 'بیضی'],
                correct: 2
            }, {
                question: 'برای خوشحال کردن دوستت چه کاری انجام می‌دهی؟',
                options: ['باهاش دعوا می‌کنم', 'بهش لبخند می‌زنم 😊', 'نادیده‌اش می‌گیرم', 'ازش دور می‌شوم'],
                correct: 1
            }];

            // ----- متغیرها -----
            let currentIndex = 0;
            let score = 0;
            let answered = false;
            let totalQuestions = questions.length;

            const elements = {
                questionText: document.getElementById('questionText'),
                optionsContainer: document.getElementById('optionsContainer'),
                nextBtn: document.getElementById('nextBtn'),
                resetBtn: document.getElementById('resetBtn'),
                retryBtn: document.getElementById('retryBtn'),
                homeBtn: document.getElementById('homeBtn'),
                scoreDisplay: document.getElementById('scoreDisplay'),
                progressBar: document.getElementById('progressBar'),
                questionCounter: document.getElementById('questionCounter'),
                progressPercent: document.getElementById('progressPercent'),
                qBadge: document.getElementById('qBadge'),
                quizContent: document.getElementById('quizContent'),
                resultScreen: document.getElementById('resultScreen'),
                finalScore: document.getElementById('finalScore'),
                resultStars: document.getElementById('resultStars'),
                resultMsg: document.getElementById('resultMsg'),
            };

            // ----- توابع کمکی -----
            function shuffleArray(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            // شافل کردن گزینه‌ها (برای تنوع) اما صحیح را نگه می‌داریم
            function shuffleOptions(q) {
                const opts = q.options.map((text, idx) => ({ text, idx }));
                const shuffled = shuffleArray([...opts]);
                const newOptions = shuffled.map(item => item.text);
                const newCorrect = shuffled.findIndex(item => item.idx === q.correct);
                return { options: newOptions, correct: newCorrect };
            }

            // ذخیره نسخه شافل شده برای هر سوال (یک بار)
            const shuffledQuestions = questions.map(q => {
                const shuffled = shuffleOptions(q);
                return {
                    question: q.question,
                    options: shuffled.options,
                    correct: shuffled.correct,
                    originalCorrect: q.correct // برای نمایش در توضیحات
                };
            });

            // ----- رندر سوال -----
            function renderQuestion(index) {
                const q = shuffledQuestions[index];
                if (!q) return;

                // به‌روزرسانی شمارنده
                elements.qBadge.textContent = `سوال ${index + 1}`;
                elements.questionCounter.textContent = `سوال ${index + 1} از ${totalQuestions}`;
                const progress = ((index) / totalQuestions) * 100;
                elements.progressBar.style.width = progress + '%';
                elements.progressPercent.textContent = Math.round(progress) + '%';

                // نمایش سوال
                const emojis = ['🧠', '✨', '🌟', '🎯', '🌈', '🦄', '🚀', '🎈', '🍭', '🏅'];
                const emoji = emojis[index % emojis.length];
                elements.questionText.innerHTML = `<span class="emoji">${emoji}</span> ${q.question}`;

                // ساخت گزینه‌ها
                const letters = ['آ', 'ب', 'ج', 'د'];
                elements.optionsContainer.innerHTML = '';
                q.options.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerHTML = `<span class="letter">${letters[idx]}</span> ${opt}`;
                    btn.dataset.index = idx;
                    btn.addEventListener('click', () => handleOptionClick(idx, btn));
                    elements.optionsContainer.appendChild(btn);
                });

                // ریست وضعیت
                answered = false;
                elements.nextBtn.disabled = true;
                document.querySelectorAll('.option-btn').forEach(b => {
                    b.classList.remove('correct', 'wrong', 'disabled', 'show-correct');
                });

                // آپدیت اسکور
                elements.scoreDisplay.textContent = score;
            }

            // ----- مدیریت کلیک روی گزینه -----
            function handleOptionClick(selectedIdx, btnElement) {
                if (answered) return;
                const q = shuffledQuestions[currentIndex];
                const isCorrect = (selectedIdx === q.correct);

                // غیرفعال کردن همه دکمه‌ها
                document.querySelectorAll('.option-btn').forEach(b => {
                    b.classList.add('disabled');
                });

                // نمایش پاسخ صحیح و غلط
                document.querySelectorAll('.option-btn').forEach((b, idx) => {
                    if (idx === q.correct) {
                        b.classList.add('correct');
                    }
                    if (idx === selectedIdx && !isCorrect) {
                        b.classList.add('wrong');
                    }
                });

                // امتیاز
                if (isCorrect) {
                    score += 10;
                    elements.scoreDisplay.textContent = score;
                }

                answered = true;
                elements.nextBtn.disabled = false;
            }

            // ----- رفتن به سوال بعدی یا پایان -----
            function goToNext() {
                if (!answered) return;

                if (currentIndex < totalQuestions - 1) {
                    currentIndex++;
                    renderQuestion(currentIndex);
                } else {
                    // نمایش نتیجه
                    showResult();
                }
            }

            // ----- نمایش نتیجه -----
            function showResult() {
                elements.quizContent.classList.add('hidden');
                elements.resultScreen.classList.add('active');
                elements.progressBar.style.width = '100%';
                elements.progressPercent.textContent = '۱۰۰٪';

                const finalScore = score;
                elements.finalScore.textContent = finalScore;

                // ستاره‌ها و پیام
                let stars, msg;
                if (finalScore === 100) {
                    stars = '🌟🌟🌟🌟🌟';
                    msg = '🎉 عالی! تو یک نابغه‌ای! به این پیشرفت افتخار کن.';
                } else if (finalScore >= 80) {
                    stars = '🌟🌟🌟🌟';
                    msg = '😍 خیلی خوب! تو بسیار باهوش و تلاشگری.';
                } else if (finalScore >= 60) {
                    stars = '🌟🌟🌟';
                    msg = '🤗 خوب بود! با کمی تمرین می‌تونی عالی بشی.';
                } else if (finalScore >= 40) {
                    stars = '🌟🌟';
                    msg = '💪 ناامید نشو! هر روز یک قدم جلوتر.';
                } else {
                    stars = '🌟';
                    msg = '🌱 شروع خوبی است! با تمرین بیشتر پیشرفت می‌کنی.';
                }
                elements.resultStars.textContent = stars;
                elements.resultMsg.textContent = msg;
            }

            // ----- ریست کامل -----
            function resetQuiz() {
                currentIndex = 0;
                score = 0;
                answered = false;
                elements.scoreDisplay.textContent = '۰';
                elements.resultScreen.classList.remove('active');
                elements.quizContent.classList.remove('hidden');
                // دوباره شافل کردن سوالات برای تنوع
                shuffledQuestions.forEach((q, idx) => {
                    const fresh = shuffleOptions(questions[idx]);
                    q.options = fresh.options;
                    q.correct = fresh.correct;
                });
                renderQuestion(0);
            }

            // ----- رویدادها -----
            elements.nextBtn.addEventListener('click', goToNext);

            elements.resetBtn.addEventListener('click', resetQuiz);

            elements.retryBtn.addEventListener('click', resetQuiz);

            elements.homeBtn.addEventListener('click', function() {
                window.location.href = 'aidaacademy-landing.html';
            });

            // صفحه‌کلید: دکمه Space برای Next
            document.addEventListener('keydown', (e) => {
                if (e.key === ' ' || e.key === 'Enter') {
                    if (!elements.nextBtn.disabled && !elements.resultScreen.classList.contains('active')) {
                        e.preventDefault();
                        goToNext();
                    }
                }
            });

            // ----- شروع اولیه -----
            resetQuiz();

            // نمایش پیام خوش‌آمدگویی با انیمیشن (اختیاری)
            console.log('🦉 آزمون هوش و استعدادیابی آکادمی آیدا شروع شد!');
        })();
    </script>

</body>
